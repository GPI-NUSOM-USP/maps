<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>MapLibre Fullscreen Map</title>

        <script src="pd4web.threads.js"></script>
        <script src="pd4web.js"></script>

        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" />

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            #map {
                width: 100vw;
                height: 100vh;
            }

            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .modal {
                background: white;
                padding: 20px;
                border-radius: 8px;
                width: 400px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .start-panel {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                z-index: 900;
                width: min(360px, calc(100vw - 32px));
                background: #ffffff;
                border: 1px solid rgba(0, 0, 0, 0.14);
                border-radius: 8px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
                padding: 14px;
                display: flex;
                gap: 12px;
                align-items: center;
            }

            .start-panel button {
                border: 0;
                border-radius: 6px;
                background: #111827;
                color: white;
                font-size: 16px;
                font-weight: 700;
                padding: 12px 16px;
                white-space: nowrap;
            }

            .start-panel button:disabled {
                background: #6b7280;
            }

            .start-panel span {
                color: #1f2937;
                font: 14px/1.3 system-ui, sans-serif;
            }
        </style>
    </head>

    <body>
        <!-- <div style="margin: 10px; display: flex; align-items: center; gap: 10px"> -->
        <!--     <button onclick="addNewAudio()">Add New Audio</button> -->
        <!--     <div id="positions">Click to get lat/log of that place</div> -->
        <!--     <div id="compass"></div> -->
        <!-- </div> -->

        <div id="map"></div>
        <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

        <div id="startPanel" class="start-panel">
            <button id="startButton" type="button" onclick="startExperience()">Start</button>
            <span id="startStatus">Start audio, location, and compass.</span>
        </div>

        <div id="audioOverlay" class="overlay" style="display: none">
            <div class="modal">
                <h3>New Áudio</h3>

                <label>Arquivo MP3 ou WAV</label>
                <input type="file" id="audioFile" accept=".mp3,.wav,audio/mpeg,audio/wav" />

                <label>Nome do Áudio</label>
                <input type="text" id="audioName" />

                <label>Latitude</label>
                <input type="number" id="latitude" step="any" />

                <label>Longitude</label>
                <input type="number" id="longitude" step="any" />

                <label>Source Number</label>
                <input type="number" id="sourceNumber" />

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px">
                    <button onclick="closeAudioModal()">Cancelar</button>
                    <button onclick="saveAudio()">Salvar</button>
                </div>
            </div>
        </div>

        <script>
            var Pd4Web = null;
            var Pd4WebModuleAsync = null;
            Pd4WebModule().then((module) => {
                Pd4WebModuleAsync = module;
                Pd4Web = new module.Pd4Web();
            });
        </script>
        <script src="map.js"></script>
    </body>
</html>
